name: ${COMPOSE_PROJECT_NAME:-erpnext-optimized}
services:
  erpnext:
    image: ${IMAGE_NAME:-ghcr.io/1988199/erpnext-optimized:V16.52.0-opt-20261012.1}
    restart: unless-stopped
    stop_grace_period: 5m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8091}:80"
    environment:
      SITE_NAME: ${SITE_NAME:-erp.localhost}
      INIT_SITE: ${INIT_SITE:-1}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Pass1234}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Pass1234}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - database:/var/lib/mysql
      - redis:/var/lib/redis
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
volumes:
  database:
  redis:
  sites:
  logs:

