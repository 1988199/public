name: ${COMPOSE_PROJECT_NAME:-erpnext-optimized}
services:
  erpnext:
    image: ${IMAGE_NAME:-ghcr.io/1988199/erpnext-optimized:V16.53.0-opt-20261026.1}
    restart: unless-stopped
    stop_grace_period: ${STOP_GRACE_PERIOD:-600s}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8091}:80"
    environment:
      SITE_NAME: ${SITE_NAME:-erp.localhost}
      INIT_SITE: ${INIT_SITE:-1}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Pass1234}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Pass1234}
      TZ: ${TZ:-Asia/Shanghai}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-1}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_START_DELAY_SECONDS: ${BACKUP_START_DELAY_SECONDS:-60}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_RETRIES: ${BACKUP_RETRIES:-3}
      BACKUP_TIMEOUT_SECONDS: ${BACKUP_TIMEOUT_SECONDS:-900}
      BACKUP_COPY_DIR: ${BACKUP_COPY_DIR:-}
      BACKUP_COPY_RETENTION_DAYS: ${BACKUP_COPY_RETENTION_DAYS:-30}
      BACKUP_ENCRYPTION_KEY_FILE: ${BACKUP_ENCRYPTION_KEY_FILE:-}
      REQUIRED_APPS: ${REQUIRED_APPS:-}
      REQUIRED_MODULES: ${REQUIRED_MODULES:-}
      REQUIRED_ASSET_PATHS: ${REQUIRED_ASSET_PATHS:-}
      DEPLOYMENT_READY_FILE: ${DEPLOYMENT_READY_FILE:-}
      VERIFY_QUEUE_HEARTBEAT: ${VERIFY_QUEUE_HEARTBEAT:-1}
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-300}
    volumes:
      - database:/var/lib/mysql
      - redis:/var/lib/redis
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
volumes:
  database:
  redis:
  sites:
  logs:

