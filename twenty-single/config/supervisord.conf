[unix_http_server]
file=/run/twenty/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/twenty/supervisord.pid
childlogdir=/run/twenty

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/twenty/supervisor.sock

[program:postgres]
command=/usr/local/lib/twenty-single/postgres.sh
user=postgres
priority=10
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server /etc/twenty-single/redis.conf
user=redis
priority=20
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:server]
command=/usr/local/lib/twenty-single/server.sh
directory=/app/packages/twenty-server
user=node
environment=HOME="/home/node"
priority=30
autorestart=true
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
command=/usr/local/lib/twenty-single/worker.sh
directory=/app/packages/twenty-server
user=node
environment=HOME="/home/node",DISABLE_DB_MIGRATIONS="true",DISABLE_CRON_JOBS_REGISTRATION="true"
priority=40
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
