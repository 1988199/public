name: Twenty Single Auto Build

on:
  push:
    branches: [main]
    paths:
      - 'twenty-single/**'
      - '.github/workflows/twenty-auto-build.yml'
  workflow_dispatch:
  schedule:
    - cron: '43 2 * * *'

permissions:
  contents: write
  packages: write

concurrency:
  group: twenty-single-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve official stable release and Docker tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 twenty-single/scripts/detect-version.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide whether a build is needed
        id: decision
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/twenty-single"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          CURRENT=$(tr -d '[:space:]' < twenty-single/VERSION)
          BUILD=true
          if [[ "$EVENT" == schedule && "$CURRENT" == "$VERSION" ]] && docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            BUILD=false
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: Build candidate locally (not published yet)
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./twenty-single
          load: true
          platforms: linux/amd64
          build-args: TWENTY_TAG=${{ steps.version.outputs.tag }}
          tags: twenty-single:candidate
          cache-from: type=gha,scope=twenty-single
          cache-to: type=gha,mode=max,scope=twenty-single
      - name: Test startup, persistence and Supervisor recovery
        if: steps.decision.outputs.build == 'true'
        run: bash twenty-single/scripts/smoke-test.sh twenty-single:candidate
      - name: Publish the tested image
        if: steps.decision.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.decision.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for TAG in "$VERSION" "twenty-$VERSION" latest; do
            docker tag twenty-single:candidate "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done
          {
            echo "### Published Twenty $VERSION"
            echo "- Image: $IMAGE"
            echo "- Tags: latest, $VERSION, twenty-$VERSION"
            echo '- Passed: HTTP, four services, data persistence, worker recovery'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record version after successful publication
        if: steps.decision.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > twenty-single/VERSION
          sed -i -E "s/^ARG TWENTY_TAG=.*/ARG TWENTY_TAG=$UPSTREAM_TAG/" twenty-single/Dockerfile
          if git diff --quiet -- twenty-single/VERSION twenty-single/Dockerfile; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twenty-single/VERSION twenty-single/Dockerfile
          git commit -m "chore(twenty): update to $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
