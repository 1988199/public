name: Twenty Single Auto Build

on:
  push:
    branches: [main]
    paths:
      - 'twenty-single/Dockerfile'
      - 'twenty-single/compose.yml'
      - 'twenty-single/.dockerignore'
      - 'twenty-single/.gitattributes'
      - 'twenty-single/.env.example'
      - 'twenty-single/config/**'
      - 'twenty-single/scripts/**'
      - '.github/workflows/twenty-auto-build.yml'
  workflow_dispatch:
  schedule:
    - cron: '57 2 * * *'

permissions:
  contents: write
  packages: write

concurrency:
  group: twenty-single-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Require the default branch for publishing
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Select the main branch when manually publishing.' >&2
            exit 1
          fi
      - name: Resolve official stable release and Docker tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 twenty-single/scripts/detect-version.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide whether a build is needed
        id: decision
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/twenty-single"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          CURRENT=$(tr -d '[:space:]' < twenty-single/VERSION)
          BUILD=true
          if [[ "$EVENT" == schedule && "$CURRENT" == "$VERSION" ]] \
            && docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1 \
            && docker buildx imagetools inspect "$IMAGE:latest" >/dev/null 2>&1 \
            && docker buildx imagetools inspect "$IMAGE:twenty-$VERSION" >/dev/null 2>&1 \
            && [[ "$(docker manifest inspect --verbose "$IMAGE:$VERSION" | jq -er '.Descriptor.digest')" == "$(docker manifest inspect --verbose "$IMAGE:latest" | jq -er '.Descriptor.digest')" ]] \
            && [[ "$(docker manifest inspect --verbose "$IMAGE:$VERSION" | jq -er '.Descriptor.digest')" == "$(docker manifest inspect --verbose "$IMAGE:twenty-$VERSION" | jq -er '.Descriptor.digest')" ]]; then
            BUILD=false
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "官方稳定版本：$VERSION；已记录版本：$CURRENT；需要构建：$BUILD。" >> "$GITHUB_STEP_SUMMARY"
      - name: Build candidate locally (not published yet)
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./twenty-single
          load: true
          platforms: linux/amd64
          build-args: TWENTY_TAG=${{ steps.version.outputs.tag }}
          tags: twenty-single:candidate
          cache-from: type=gha,scope=twenty-single
          cache-to: type=gha,mode=max,scope=twenty-single
      - name: Test startup, persistence and Supervisor recovery
        id: smoke
        if: steps.decision.outputs.build == 'true'
        run: bash twenty-single/scripts/smoke-test.sh twenty-single:candidate
      - name: Publish the tested image
        if: success() && steps.decision.outputs.build == 'true' && steps.smoke.outcome == 'success'
        env:
          IMAGE: ${{ steps.decision.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for TAG in "$VERSION" "twenty-$VERSION" latest; do
            docker tag twenty-single:candidate "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done
          {
            echo "### Published Twenty $VERSION"
            echo "- Image: $IMAGE"
            echo "- Tags: latest, $VERSION, twenty-$VERSION"
            echo '- Passed: HTTP, four services, data persistence, worker recovery'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record version after successful publication
        if: steps.decision.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > twenty-single/VERSION
          sed -i -E "s/^ARG TWENTY_TAG=.*/ARG TWENTY_TAG=$UPSTREAM_TAG/" twenty-single/Dockerfile
          if git diff --quiet -- twenty-single/VERSION twenty-single/Dockerfile; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twenty-single/VERSION twenty-single/Dockerfile
          git commit -m "chore(twenty): update to $VERSION [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: 记录失败结果
        if: failure()
        run: echo '检查、构建、测试或发布失败。测试未通过不会发布；未记录的新版本将在下次每日检查重新尝试。请查看失败步骤日志。' >> "$GITHUB_STEP_SUMMARY"
