name: EspoCRM Build Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./espocrm-cn-single
          file: ./espocrm-cn-single/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            ESPOCRM_VERSION=10.0.8
          tags: |
            ghcr.io/${{ github.repository_owner }}/espocrm-cn-single:latest
            ghcr.io/${{ github.repository_owner }}/espocrm-cn-single:10.0.8
