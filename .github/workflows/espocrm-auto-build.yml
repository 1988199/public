name: EspoCRM Auto Build

on:
  push:
    branches:
      - main
    paths:
      - "espocrm-cn-single/Dockerfile"
      - "espocrm-cn-single/docker-compose.yml"
      - "espocrm-cn-single/config/**"
      - "espocrm-cn-single/scripts/**"
      - "espocrm-cn-single/.env.example"
      - "espocrm-cn-single/VERSION"
      - ".github/workflows/espocrm-auto-build.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write
  packages: write

concurrency:
  group: espocrm-single-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read current version and detect latest
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then exit 1; fi
          python3 espocrm-cn-single/scripts/detect-version.py

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to build and publish
        id: decision
        env:
          CURRENT: ${{ steps.ver.outputs.current }}
          LATEST: ${{ steps.ver.outputs.latest }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/espocrm-cn-single"
          BUILD=true
          if [[ "$EVENT" == schedule && "$CURRENT" == "$LATEST" ]] \
            && docker buildx imagetools inspect "$IMAGE:latest" >/dev/null 2>&1 \
            && docker buildx imagetools inspect "$IMAGE:$LATEST" >/dev/null 2>&1 \
            && docker buildx imagetools inspect "$IMAGE:espocrm-$LATEST" >/dev/null 2>&1; then
            BUILD=false
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "官方稳定版本：$LATEST；已记录版本：$CURRENT；需要构建：$BUILD。" >> "$GITHUB_STEP_SUMMARY"

      - name: Build candidate image
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./espocrm-cn-single
          file: ./espocrm-cn-single/Dockerfile
          load: true
          platforms: linux/amd64
          build-args: |
            ESPOCRM_VERSION=${{ steps.ver.outputs.latest }}
          tags: espocrm-single:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test startup and persistence
        id: smoke
        if: steps.decision.outputs.build == 'true'
        run: bash espocrm-cn-single/scripts/smoke-test.sh espocrm-single:candidate

      - name: Publish tested image
        if: success() && steps.decision.outputs.build == 'true' && steps.smoke.outcome == 'success'
        env:
          VERSION: ${{ steps.ver.outputs.latest }}
        run: |
          set -Eeuo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/espocrm-cn-single"
          for TAG in "$VERSION" "espocrm-$VERSION" latest; do
            docker tag espocrm-single:candidate "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done
          echo "测试通过并发布 EspoCRM $VERSION：版本标签、espocrm-$VERSION、latest。" >> "$GITHUB_STEP_SUMMARY"

      - name: Update VERSION after successful build
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.latest }}"
          printf '%s\n' "$VERSION" > espocrm-cn-single/VERSION
          sed -i -E "s/^ARG ESPOCRM_VERSION=.*/ARG ESPOCRM_VERSION=$VERSION/" espocrm-cn-single/Dockerfile

          if git diff --quiet -- espocrm-cn-single/VERSION espocrm-cn-single/Dockerfile; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espocrm-cn-single/VERSION espocrm-cn-single/Dockerfile
          git commit -m "chore(espocrm): update to $VERSION [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: 记录失败结果
        if: failure()
        run: echo '检查、构建、测试或发布失败。测试未通过不会发布；未记录的新版本将在下次每日检查重新尝试。请查看失败步骤日志。' >> "$GITHUB_STEP_SUMMARY"
