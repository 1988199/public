name: Auto Build EspoCRM CN Single Image

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force_version:
        description: "Optional EspoCRM version, e.g. 10.0.8"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "espocrm-cn-single/**"
      - ".github/workflows/espocrm-auto-build.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: espocrm-auto-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/espocrm-cn-single
  PROJECT_DIR: espocrm-cn-single

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      changed: ${{ steps.pick.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect latest EspoCRM Docker tag
        id: pick
        shell: bash
        env:
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
        run: |
          set -euo pipefail

          CURRENT="$(cat "${PROJECT_DIR}/VERSION" | tr -d '[:space:]')"

          if [ -n "${FORCE_VERSION:-}" ]; then
            LATEST="${FORCE_VERSION}"
          else
            LATEST="$(
              curl -fsSL "https://hub.docker.com/v2/repositories/espocrm/espocrm/tags?page_size=100&ordering=last_updated" |
              python3 -c '
import json, sys, re
d=json.load(sys.stdin)
versions=[]
for r in d.get("results", []):
    n=r.get("name","")
    if re.fullmatch(r"\d+\.\d+\.\d+", n):
        versions.append(tuple(map(int,n.split("."))))
if not versions:
    raise SystemExit("No semantic version tags found")
print(".".join(map(str,max(versions))))
'
            )"
          fi

          echo "Current: ${CURRENT}"
          echo "Latest : ${LATEST}"
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"

          if [ "${CURRENT}" = "${LATEST}" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.PROJECT_DIR }}
          file: ./${{ env.PROJECT_DIR }}/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            ESPOCRM_VERSION=${{ needs.detect.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.detect.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:espocrm-${{ needs.detect.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Update tracked version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.detect.outputs.version }}"
          printf '%s\n' "${VERSION}" > "${PROJECT_DIR}/VERSION"
          sed -i -E "s/^ARG ESPOCRM_VERSION=.*/ARG ESPOCRM_VERSION=${VERSION}/" "${PROJECT_DIR}/Dockerfile"

          if git diff --quiet -- "${PROJECT_DIR}/VERSION" "${PROJECT_DIR}/Dockerfile"; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PROJECT_DIR}/VERSION" "${PROJECT_DIR}/Dockerfile"
          git commit -m "chore(espocrm): auto update to ${VERSION}"
          git push

      - name: Summary
        run: |
          {
            echo "## EspoCRM image published"
            echo ""
            echo "- Version: \`${{ needs.detect.outputs.version }}\`"
            echo "- Image: \`ghcr.io/${{ env.IMAGE_NAME }}:latest\`"
            echo "- Version tag: \`ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.detect.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
