name: EspoCRM Auto Build

on:
  push:
    branches:
      - main
    paths:
      - "espocrm-cn-single/Dockerfile"
      - "espocrm-cn-single/docker-compose.yml"
      - "espocrm-cn-single/config/**"
      - "espocrm-cn-single/scripts/**"
      - "espocrm-cn-single/.env.example"
      - "espocrm-cn-single/VERSION"
      - ".github/workflows/espocrm-auto-build.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read current version and detect latest
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '[:space:]' < espocrm-cn-single/VERSION)"
          LATEST="$(curl -fsSL 'https://hub.docker.com/v2/repositories/espocrm/espocrm/tags?page_size=100' | python3 -c 'import json,sys,re; d=json.load(sys.stdin); v=[tuple(map(int,x["name"].split("."))) for x in d.get("results",[]) if re.fullmatch(r"[0-9]+[.][0-9]+[.][0-9]+",x.get("name",""))]; print(".".join(map(str,max(v))))')"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Current=$CURRENT"
          echo "Latest=$LATEST"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to build and publish
        id: decision
        env:
          CURRENT: ${{ steps.ver.outputs.current }}
          LATEST: ${{ steps.ver.outputs.latest }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/espocrm-cn-single"
          BUILD=true
          if [[ "$EVENT" == schedule && "$CURRENT" == "$LATEST" ]] \
            && docker buildx imagetools inspect "$IMAGE:latest" >/dev/null 2>&1 \
            && docker buildx imagetools inspect "$IMAGE:$LATEST" >/dev/null 2>&1 \
            && docker buildx imagetools inspect "$IMAGE:espocrm-$LATEST" >/dev/null 2>&1; then
            BUILD=false
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./espocrm-cn-single
          file: ./espocrm-cn-single/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            ESPOCRM_VERSION=${{ steps.ver.outputs.latest }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/espocrm-cn-single:latest
            ghcr.io/${{ github.repository_owner }}/espocrm-cn-single:${{ steps.ver.outputs.latest }}
            ghcr.io/${{ github.repository_owner }}/espocrm-cn-single:espocrm-${{ steps.ver.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update VERSION after successful build
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.latest }}"
          printf '%s\n' "$VERSION" > espocrm-cn-single/VERSION
          sed -i -E "s/^ARG ESPOCRM_VERSION=.*/ARG ESPOCRM_VERSION=$VERSION/" espocrm-cn-single/Dockerfile

          if git diff --quiet -- espocrm-cn-single/VERSION espocrm-cn-single/Dockerfile; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espocrm-cn-single/VERSION espocrm-cn-single/Dockerfile
          git commit -m "chore(espocrm): update to $VERSION [skip ci]"
          git push
