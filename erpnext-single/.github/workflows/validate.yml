name: 验证项目骨架

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 检查结构和公共数据边界
        run: python scripts/validate.py
      - name: 检查 Compose 语法
        run: docker compose --env-file .env.example config --quiet

